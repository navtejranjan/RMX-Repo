<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rejection Summary</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- html2pdf & html2canvas for PDF and JPEG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* FULL SCREEN MOBILE OVERRIDE */
        html, body {
            display: block !important;
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
            background-color: #f4f4f9 !important;
        }

        /* Fixed Top Bar */
        .summary-top-bar {
            background-color: #6a1b9a;
            color: white;
            display: flex;
            align-items: center;
            padding: 15px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            box-sizing: border-box;
        }
        .summary-top-bar i { font-size: 20px; cursor: pointer; margin-right: 15px; }
        .summary-top-bar h3 { margin: 0; font-size: 18px; font-weight: bold; }
        .summary-top-bar .header-right { margin-left: auto; margin-right: 0; font-size: 20px; cursor: pointer; }

        /* Main Content */
        .summary-main { padding: 70px 15px 30px 15px; box-sizing: border-box; }

        /* Filter Section — Always visible */
        .filter-section {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .filter-section h4 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #6a1b9a;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Date row */
        .date-filter-row {
            display: flex;
            align-items: stretch;
            margin-bottom: 12px;
            border: 2px solid #6a1b9a;
            border-radius: 6px;
            overflow: hidden;
        }
        .date-filter-row label {
            background-color: #6a1b9a;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }
        .date-filter-row input[type="date"] {
            flex: 1;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            outline: none;
            background: white;
        }

        /* Shift checkboxes */
        .shift-filter-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .shift-filter-row .shift-label {
            background-color: #6a1b9a;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px 0 0 6px;
            white-space: nowrap;
        }
        .shift-pills {
            display: flex;
            gap: 0;
            flex: 1;
            border: 2px solid #6a1b9a;
            border-radius: 6px;
            overflow: hidden;
        }
        .shift-pill {
            flex: 1;
            text-align: center;
            position: relative;
        }
        .shift-pill input[type="checkbox"] {
            display: none;
        }
        .shift-pill label {
            display: block;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: #6a1b9a;
            background: white;
            border-right: 1px solid #e0d0e8;
            transition: all 0.2s;
        }
        .shift-pill:last-child label {
            border-right: none;
        }
        .shift-pill input[type="checkbox"]:checked + label {
            background-color: #6a1b9a;
            color: white;
        }

        /* Apply button */
        .apply-btn {
            width: 100%;
            padding: 12px;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }
        .apply-btn:active { background-color: #4a148c; }

        /* Loading */
        .summary-loader {
            text-align: center;
            padding: 30px 15px;
            color: #6a1b9a;
            font-weight: bold;
            display: none;
        }
        .summary-loader i { font-size: 30px; margin-bottom: 10px; display: block; }

        /* Summary Table */
        .summary-table-wrapper {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .summary-table { width: 100%; border-collapse: collapse; }
        .summary-table thead th {
            background-color: #6a1b9a;
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
            font-weight: bold;
        }
        .summary-table thead th:last-child { text-align: right; }
        .summary-table tbody td {
            padding: 12px 15px;
            font-size: 14px;
            color: #333;
            border-bottom: 1px solid #eee;
        }
        .summary-table tbody td:last-child {
            text-align: right;
            font-weight: bold;
            color: #6a1b9a;
        }
        .summary-table tbody tr:last-child td { border-bottom: none; }
        .summary-table tbody tr:hover { background-color: #f9f5fc; }
        .summary-table .unit-label { color: #999; font-size: 12px; font-weight: normal; }
        .summary-table tfoot td {
            padding: 12px 15px;
            font-size: 15px;
            font-weight: bold;
            background-color: #f3e5f5;
            color: #4a148c;
            border-top: 2px solid #6a1b9a;
        }

        /* Info bar */
        .selected-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #f9f5fc;
            border-radius: 4px;
            border-left: 3px solid #6a1b9a;
        }

        /* No data */
        .no-data {
            text-align: center;
            padding: 30px 15px;
            color: #999;
            font-size: 16px;
        }
        .no-data i { font-size: 40px; margin-bottom: 10px; display: block; color: #ccc; }

        /* Action buttons */
        .action-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .action-bar button {
            flex: 1; padding: 12px; border: none; border-radius: 6px;
            font-size: 14px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        
        /* Dropdown Styles */
        .dropdown { flex: 1; position: relative; display: inline-block; }
        .dropdown .btn-download { width: 100%; background-color: #28a745; color: white; }
        .dropdown .btn-download:active { background-color: #1e7e34; }
        .dropdown-content {
            display: none; position: absolute; bottom: 100%; left: 0; 
            width: 100%; background-color: #f9f9f9; min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1;
            border-radius: 6px; margin-bottom: 5px; overflow: hidden;
        }
        .dropdown-content a {
            color: black; padding: 12px 16px; text-decoration: none; display: block;
            border-bottom: 1px solid #eee;
        }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background-color: #f1f1f1; }
        .dropdown.show .dropdown-content { display: block; }
        
        .btn-charts { background-color: #3b71ca; color: white; flex: 1; }
        .btn-charts:active { background-color: #2b5da6; }

        /* Error display */
        .error-box {
            background: #fff3f3;
            border: 1px solid #dc3545;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            color: #dc3545;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <header class="summary-top-bar">
        <i class="fas fa-arrow-left" onclick="location.href='home.html'"></i>
        <h3>Rejection Summary</h3>
        <i class="fas fa-chart-line header-right" onclick="location.href='reports.html'" title="View Charts"></i>
    </header>

    <!-- Main Content -->
    <main class="summary-main">

        <!-- FILTER SECTION — Always visible on page load -->
        <div class="filter-section">
            <h4><i class="fas fa-filter"></i> &nbsp;Select Date & Shift</h4>

            <!-- Date Picker -->
            <div class="date-filter-row">
                <label>Date</label>
                <input type="date" id="summaryDate">
            </div>

            <!-- Shift Checkboxes (A, B, C) -->
            <div class="shift-pills">
                <div class="shift-pill">
                    <input type="checkbox" id="shiftA" value="A" checked>
                    <label for="shiftA">A</label>
                </div>
                <div class="shift-pill">
                    <input type="checkbox" id="shiftB" value="B" checked>
                    <label for="shiftB">B</label>
                </div>
                <div class="shift-pill">
                    <input type="checkbox" id="shiftC" value="C" checked>
                    <label for="shiftC">C</label>
                </div>
            </div>
            <br>
            <button type="button" class="apply-btn" id="summaryApplyBtn">
                <i class="fas fa-search"></i> &nbsp;SHOW SUMMARY
            </button>
        </div>

        <!-- Loading Spinner (hidden until Apply is clicked) -->
        <div id="summaryLoading" class="summary-loader">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Fetching data...</p>
        </div>

        <!-- Info bar -->
        <div id="selectedInfo" class="selected-info" style="display: none;"></div>

        <!-- Summary Table Container -->
        <div id="summaryContent" style="display: none;"></div>

        <!-- Action Buttons -->
        <div id="summaryActions" class="action-bar" style="display: none;">
            <div class="dropdown" id="downloadDropdownContainer">
                <button type="button" class="btn-download" id="downloadDropdownBtn">
                    <i class="fas fa-download"></i> Download <i class="fas fa-caret-up"></i>
                </button>
                <div id="downloadDropdownMenu" class="dropdown-content">
                    <a href="#" id="dlExcel"><i class="fas fa-file-excel" style="color:#28a745;"></i> Excel</a>
                    <a href="#" id="dlPdf"><i class="fas fa-file-pdf" style="color:#dc3545;"></i> PDF</a>
                    <a href="#" id="dlJpeg"><i class="fas fa-file-image" style="color:#17a2b8;"></i> JPEG</a>
                </div>
            </div>
            <button type="button" class="btn-charts" onclick="location.href='reports.html'">
                <i class="fas fa-chart-bar"></i> View Charts
            </button>
        </div>

        <!-- Error Display -->
        <div id="summaryError" class="error-box" style="display: none;"></div>

        <!-- No Data State -->
        <div id="noDataMessage" class="no-data" style="display: none;">
            <i class="fas fa-inbox"></i>
            <p>No rejection data found for the selected date & shift.</p>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
